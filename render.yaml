services:
  - type: web
    name: gio-studio-demo
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run check && npm test
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: /tmp/gio-studio/shop.sqlite
